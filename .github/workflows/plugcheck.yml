name: plugcheck

on:
  push:
    branches: [main]
  pull_request:

jobs:
  self-check:
    strategy:
      fail-fast: false
      matrix:
        # Windows 是主阵地（pwsh / realpath / 大小写不敏感路径），Linux 用来兜底跨平台回归
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 离线自检：不连板子、不启动 DSH，只断言 apply() 注册了 18 个工具、render 输出合法、
      # 核心路由在、Host 调度器 take→dispatch→attach、dispose 清掉 4 个定时器。
      - run: node scripts/plugcheck.mjs
      # 重载契约：apply→cleanup→apply 不撞名、cleanup 之后工具/路由/订阅归零、
      # 半装载失败要整体回滚（复刻 dsh-host-webserver 的重复路由语义，见 v1.1.11）
      - run: node scripts/reload-smoke.mjs
      # v2.0.2：配置持久化 / solo 自举（含同目录二次 apply）/ shell 白名单 fail-closed。
      # 这几个都是「装完第一次用」的路径，回归一次就能挡住 PC2 那类事故。
      - run: node scripts/config-persist-smoke.mjs
      - run: node scripts/solo-board-smoke.mjs
      - run: node scripts/solo-bootstrap-smoke.mjs
      - run: node scripts/shell-guard-smoke.mjs
      - run: node scripts/ui-guard-smoke.mjs
      # v2.1.0：派工前的「机器 + 模型」选择（board_options 汇总 / needSelection 拦截 / exec 忽略 model）。
      - run: node scripts/model-pick-smoke.mjs
      - run: node scripts/update-check-smoke.mjs
      # 假板子 + 假 hub，同样不连真环境。
      - run: node scripts/dispatch-recovery-smoke.mjs
      # 状态文件的跨进程锁（v1.3.1）：真起 4 个子进程并发读改写同一个文件，断言一次
      # 更新都不丢。用 spawnSync 会退化成串行、测不出这个问题，别改回去。
      - run: node scripts/state-file-smoke.mjs
      # 端到端验收（#10 建议 5）：起仓库自带的 fake-board，用插件自己的 board_*
      # 工具走 认领→心跳→交付/打回 全流程，最后核对板子终态。
      # GP_ACCEPT_FIXTURES=1 强制走"本机没有素材"的分支：素材现造或跳过，
      # 不依赖 runner 上装了什么（acc-04 缺 ffmpeg 时自动跳过而不是失败）。
      - run: node scripts/acceptance.mjs --port 8977
        env:
          GP_ACCEPT_FIXTURES: '1'
      # v1.4.0：board_server.py 随仓库发布（tools/），CI 真起两个进程验契约——
      # 单实例锁、机器名大小写归一、身份校验、请求体上限。以前它只活在共享盘上，
      # 没有历史也没有测试，改完靠手抄，跑没跑上新代码只能靠 probe 猜。
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/board-server-smoke.py
