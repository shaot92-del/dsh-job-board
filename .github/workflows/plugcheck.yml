name: plugcheck

on:
  push:
    branches: [main]
  pull_request:

jobs:
  self-check:
    strategy:
      fail-fast: false
      matrix:
        # Windows 是主阵地（pwsh / realpath / 大小写不敏感路径），Linux 用来兜底跨平台回归
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 离线自检：不连板子、不启动 DSH，只断言 apply() 注册了 16 个工具、render 输出合法、
      # 核心路由在、Host 调度器 take→dispatch→attach、dispose 清掉 4 个定时器。
      - run: node scripts/plugcheck.mjs
      # 重载契约：apply→cleanup→apply 不撞名、cleanup 之后工具/路由/订阅归零、
      # 半装载失败要整体回滚（复刻 dsh-host-webserver 的重复路由语义，见 v1.1.11）
      - run: node scripts/reload-smoke.mjs
