name: plugcheck

on:
  push:
    branches: [main]
  pull_request:

jobs:
  self-check:
    strategy:
      fail-fast: false
      matrix:
        # Windows 是主阵地（pwsh / realpath / 大小写不敏感路径），Linux 用来兜底跨平台回归
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 离线自检：不连板子、不启动 DSH，只断言 apply() 注册了 16 个工具、render 输出合法、
      # 核心路由在、Host 调度器 take→dispatch→attach、dispose 清掉 4 个定时器。
      - run: node scripts/plugcheck.mjs
      # 重载契约：apply→cleanup→apply 不撞名、cleanup 之后工具/路由/订阅归零、
      # 半装载失败要整体回滚（复刻 dsh-host-webserver 的重复路由语义，见 v1.1.11）
      - run: node scripts/reload-smoke.mjs
      # 派工恢复（#10-1，v1.2.0）：结果未知先查询不重派、已认领未发出直接补发。
      # 假板子 + 假 hub，同样不连真环境。
      - run: node scripts/dispatch-recovery-smoke.mjs
      # 状态文件的跨进程锁（v1.3.1）：真起 4 个子进程并发读改写同一个文件，断言一次
      # 更新都不丢。用 spawnSync 会退化成串行、测不出这个问题，别改回去。
      - run: node scripts/state-file-smoke.mjs
      # 端到端验收（#10 建议 5）：起仓库自带的 fake-board，用插件自己的 board_*
      # 工具走 认领→心跳→交付/打回 全流程，最后核对板子终态。
      # GP_ACCEPT_FIXTURES=1 强制走"本机没有素材"的分支：素材现造或跳过，
      # 不依赖 runner 上装了什么（acc-04 缺 ffmpeg 时自动跳过而不是失败）。
      - run: node scripts/acceptance.mjs --port 8977
        env:
          GP_ACCEPT_FIXTURES: '1'
