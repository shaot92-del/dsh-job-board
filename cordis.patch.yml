# dsh-job-board 组合包补丁：把「团队 · 作业板」插件行插入 profile 的 loader。
#
# 为什么插入必须写在包里、而不是只写在 profile 的 cordis.patch.yml 里：
# profile patch 是「按 id 覆盖已存在的行」。把 `- insert:` 只写在 profile patch 里，
# 实测插件行不会被插入 —— 现象正是：客户端 bundle 被扫到（侧栏出现图标），
# 但 Host 半边永远不 apply（工具不注册、/api/board/ui/* 不存在，面板一律"没连上"）。
# 与 dsh-remote-agent / dsh-ffmpeg 一致：插入放包内 patch，用户在自己的 patch 里按 id 覆盖 config。
#
# inject 必须声明：cordis 的防护是「没声明 inject 就不能访问服务」，
# 直接读 ctx.webServer / ctx.tools 会抛 cannot get property "..." without inject。
# 运行时用 ctx.inject() 也不行（子 fiber 会被回收，路由注册完随即 DISPOSED）。
- insert:
    - id: team
      name: 'dsh-job-board'
      inject: ['webServer', 'tools']
      config:
        # 留空 = 自动探测（主机名 → <board-host> → 本机回环）；写死会让副机永远指向自己。
        boardUrl: ''
        # 留空 = 按 hostname 自动映射（host / GT14 / MB14 / PC2）。
        machine: ''
        token: ''
        timeoutMs: 8000
        # shell 工具（sh_run / sh_read / sh_write / sh_list）
        allowedRoots: []
        shellTimeoutMs: 120000
        maxOutputBytes: 200000
